name: jaspr_shell
description: A new Jaspr project
version: 0.0.1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  jaspr: ^0.23.5
  jaspr_flutter_embed: ^0.4.11
  jaspr_router: ^0.9.0
  todo_flutter:
    path: ../todo_flutter

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  lints: ^5.0.0

jaspr:
  mode: client
  flutter: embedded

flutter:
  uses-material-design: true
